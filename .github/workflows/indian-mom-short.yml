name: Render Indian Mom Short

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "indian-mom-vs-mobile-phone/**"
      - ".github/workflows/indian-mom-short.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and Hindi fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
      - name: Install Python packages
        run: pip install pillow gTTS
      - name: Render 50-second video
        run: python indian-mom-vs-mobile-phone/video/generate.py
      - name: Upload finished MP4
        uses: actions/upload-artifact@v4
        with:
          name: indian-mom-vs-mobile-phone-50s
          path: indian-mom-vs-mobile-phone/output/indian_mom_vs_mobile_phone_50s.mp4
          if-no-files-found: error
          retention-days: 7
